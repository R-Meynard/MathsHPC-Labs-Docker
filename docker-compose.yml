services:
  cpp-dev-tools:
    build:
      context: ./cpp-dev-tools
      dockerfile: Dockerfile
      args:
        INCLUDE_DEEPLEARNING: "false"
        GO_VERSION: "1.24.0"

    container_name: "${COMPOSE_PROJECT_NAME:-mathshpc}_hpc-backend-dev"
    restart: unless-stopped

    # GPU (legacy / compatible with setups that support it)
    runtime: nvidia

    ipc: host
    shm_size: "1gb"

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      HOME: "/root"
      USER: "root"
      PYTHONPATH: "/workspaces"

    volumes:
      - ${HOME}/Workspace/MathsHPC-Labs:/workspaces/MathsHPC-Labs:cached
      - ${HOME}/Workspace/hpc-backend-stack:/workspaces/hpc-backend-stack:cached

      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ssh:/root/.ssh:ro

      - go-modules-cache:/root/go
      - pip-cache:/root/.cache/pip
      - cargo-cache:/root/.cargo

    stdin_open: true
    tty: true

volumes:
  go-modules-cache:
  pip-cache:
  cargo-cache: